<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Essence Fit | Painel da lojista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--baby:#a6d7ee;--baby2:#e6f3fa;--ink:#123d5f;--muted:#3a5a75;--line:#cfe0ec;--off:#8aa0b2;--ok:#2f8f5b;--bad:#b4443c;--r:14px}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font-family:'Jost',system-ui,sans-serif;color:var(--ink);background:#f6fafd;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select,textarea{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:.85rem;color:var(--muted);margin-top:10px}
label input,label select,label textarea{margin-top:4px;color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn{display:inline-block;background:var(--ink);color:#fff;border-radius:99px;padding:10px 20px;font-weight:500;text-decoration:none;text-align:center}
.btn.alt{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.red{background:var(--bad)}.btn.sm{padding:6px 14px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:wait}
.wrap{max-width:1000px;margin:0 auto;padding:0 14px}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lcard{background:#fff;border-radius:22px;padding:30px 26px;width:min(380px,100%);box-shadow:0 14px 40px rgba(18,61,95,.12)}
.lcard h1{font-weight:400;font-size:1.6rem}.lcard p{color:var(--muted);font-size:.92rem;margin:4px 0 8px}
.err{color:var(--bad);font-size:.9rem;margin-top:8px;min-height:1.2em}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:58px;gap:10px}
.logo{font-size:1.3rem;font-weight:500;letter-spacing:.04em}.logo span{font-weight:300}
.hl{display:flex;gap:14px;align-items:center;font-size:.9rem}.hl a,.hl button{color:var(--muted);text-decoration:none}
.tabs{display:flex;gap:6px;padding:12px 0 4px;overflow-x:auto}
.tab{flex:none;padding:9px 20px;border-radius:99px;background:#fff;border:1.5px solid var(--line);font-weight:500}
.tab[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab i{font-style:normal;background:var(--bad);color:#fff;border-radius:99px;padding:1px 8px;font-size:.78rem;margin-left:6px}
main{padding:10px 0 60px}
h2{font-weight:400;font-size:1.4rem;margin:14px 0 8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0}
.chip{flex:none;border:1.5px solid var(--line);border-radius:99px;padding:6px 14px;background:#fff;font-size:.9rem}
.chip[aria-pressed=true]{background:var(--baby);border-color:var(--baby)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:10px}
.pc{display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.pc .m{flex:1;min-width:0}.pc b{font-weight:500}.pc small{color:var(--muted);display:block}
.badge{display:inline-block;border-radius:99px;padding:2px 11px;font-size:.8rem;font-weight:500;background:var(--baby2)}
.badge.recebido{background:#ffe9b8}.badge.pago{background:#cdeedd}.badge.separando{background:#d9e6ff}.badge.enviado{background:#e8dcf8}.badge.entregue{background:#e2e8ec;color:var(--muted)}.badge.cancelado{background:#f6d3d0;color:var(--bad)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.prod{margin:0;padding:0;overflow:hidden}
.prod img,.noimg{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--baby2);display:grid;place-items:center;color:var(--off);font-size:.85rem}
.prod .b{padding:10px 12px 12px}.prod .b p{font-size:.88rem;color:var(--muted)}.prod .ac{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.off{opacity:.55}
.sw{display:flex;align-items:center;gap:8px;font-size:.88rem;margin-top:6px}.sw input{width:auto}
.ov{position:fixed;inset:0;background:rgba(18,61,95,.5);z-index:30;overflow-y:auto;display:none}
.ov.on{display:block}
.modal{background:#fff;border-radius:20px;width:min(640px,96vw);margin:3vh auto;padding:0 0 18px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 6px;position:sticky;top:0;background:#fff;border-radius:20px 20px 0 0;z-index:2}
.mh h3{font-weight:500;font-size:1.2rem}.mh button{font-size:1.6rem;width:36px}
.mb{padding:0 18px}.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.checks{display:flex;gap:18px;margin-top:12px;flex-wrap:wrap}.checks label{display:flex;gap:7px;align-items:center;margin:0;color:var(--ink)}.checks input{width:auto}
.ph{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.th{position:relative;width:74px}.th img{width:74px;height:98px;object-fit:cover;border-radius:10px;border:2px solid var(--line)}
.th.c img{border-color:var(--ink)}.th button{position:absolute;right:-4px;top:-6px;background:var(--bad);color:#fff;border-radius:50%;width:22px;height:22px;font-size:.9rem}
.th em{position:absolute;left:4px;bottom:6px;background:#fff;border-radius:99px;font-size:.68rem;padding:0 7px;font-style:normal}
.cor{border:1.5px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}
.cor .top{display:flex;gap:8px;align-items:center}.cor input[type=color]{width:46px;padding:2px;height:40px;flex:none}
.sz{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));margin-top:8px}.sz span{font-size:.78rem;color:var(--muted);display:block;text-align:center}.sz input{text-align:center;padding:7px 4px}
table{width:100%;border-collapse:collapse;font-size:.92rem}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}td:last-child,th:last-child{text-align:right}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.acts .btn{flex:1}
.hist{font-size:.84rem;color:var(--muted);margin-top:10px}
.sub{font-size:.9rem;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:99px;z-index:50;display:none;font-size:.92rem}
.empty{text-align:center;color:var(--muted);padding:36px 0}
.fld{display:grid;gap:8px;grid-template-columns:1fr 100px 70px auto;align-items:center;margin-top:8px}
@media(max-width:560px){.fld{grid-template-columns:1fr 80px 56px}}
.fld input[type=checkbox]{width:auto;justify-self:center}
.sugs{max-height:180px;overflow:auto;border:1.5px solid var(--line);border-radius:12px;padding:6px 12px;margin-top:6px}
.sg{display:flex;gap:8px;align-items:center;margin:0;padding:5px 0;color:var(--ink)}.sg input{width:auto}
.rvc textarea{min-height:60px}
.stars{color:#f5a623;letter-spacing:1px}
.si{display:flex;gap:12px;align-items:center;margin-top:6px}.si img{width:74px;height:98px;object-fit:cover;border-radius:10px;border:2px solid var(--line);flex:none}.si.w img{width:160px;height:70px}.si .ac2{display:flex;gap:6px;flex-wrap:wrap}
.savebar{position:sticky;bottom:0;background:#f6fafd;padding:12px 0;margin-top:14px}
code{display:block;background:var(--baby2);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:.82rem;word-break:break-all}
/* ===== Visual do painel ===== */
body{background:linear-gradient(180deg,#e9f4fb 0,#f6fafd 340px) fixed}
#login{background:radial-gradient(circle at 12% 8%,#d6ecf8 0,transparent 45%),radial-gradient(circle at 92% 92%,var(--baby) 0,transparent 42%),#eef6fb}
.lcard{border-radius:28px;padding:38px 30px;box-shadow:0 24px 60px rgba(18,61,95,.16)}.lcard h1{font-size:2rem;letter-spacing:.04em}
header{background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:0;box-shadow:0 2px 18px rgba(18,61,95,.07)}header .wrap{height:64px}
.logo em{font-style:normal;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;background:var(--baby2);color:var(--muted);border-radius:99px;padding:3px 10px;margin-left:10px;vertical-align:middle;font-weight:500}
.hl a{background:var(--baby2);padding:7px 16px;border-radius:99px;color:var(--ink);font-weight:500;transition:background .2s}.hl a:hover{background:var(--baby)}
.tabs{gap:4px;margin:18px 0 6px;padding:5px;background:#fff;border-radius:99px;box-shadow:0 4px 18px rgba(18,61,95,.08);width:fit-content;max-width:100%}
.tab{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:9px 18px;color:var(--muted);transition:background .2s,color .2s}
.tab svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tab:hover{background:var(--baby2)}.tab[aria-pressed=true]{background:var(--ink);color:#fff;box-shadow:0 6px 16px rgba(18,61,95,.28)}
.tab i{margin-left:0}@media(max-width:560px){.tab span{display:none}.tab[aria-pressed=true] span{display:inline}.tab{padding:9px 14px}}
main{padding:6px 0 70px}h2{font-size:1.25rem;font-weight:500;margin:24px 0 2px;display:flex;align-items:center;gap:10px}h2::before{content:"";width:5px;height:20px;border-radius:4px;background:var(--baby);flex:none}
.card{border:0;border-radius:18px;padding:16px 18px;margin-top:12px;box-shadow:0 4px 18px rgba(18,61,95,.07)}
input,select,textarea{border-radius:12px;border-color:#d7e5ef;background:#fbfdfe;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--baby);box-shadow:0 0 0 4px rgba(166,215,238,.4)}
.btn{box-shadow:0 6px 16px rgba(18,61,95,.2);transition:transform .15s,box-shadow .15s}.btn:hover{transform:translateY(-1px)}.btn.alt{box-shadow:none}
.chip{border:0;background:#fff;box-shadow:0 2px 8px rgba(18,61,95,.07);padding:7px 16px}.chip[aria-pressed=true]{background:var(--ink);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:#fff;border-radius:18px;padding:16px 18px;box-shadow:0 4px 18px rgba(18,61,95,.07);display:flex;flex-direction:column;gap:2px}
.stat b{font-size:1.6rem;font-weight:500;line-height:1.15}.stat span{font-size:.82rem;color:var(--muted)}
.stat.hot{background:linear-gradient(135deg,var(--ink),#1f5f92);color:#fff}.stat.hot span{color:rgba(255,255,255,.8)}
.oc{border-left:5px solid var(--line);transition:transform .2s,box-shadow .2s}.oc:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(18,61,95,.12)}
.oc.recebido{border-left-color:#f2b53b}.oc.pago{border-left-color:#4cb582}.oc.separando{border-left-color:#6c9cf0}.oc.enviado{border-left-color:#a98be0}.oc.entregue{border-left-color:#c3cfd8}.oc.cancelado{border-left-color:#d9776f}
.prod{border-radius:20px;transition:transform .2s,box-shadow .2s}.prod:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(18,61,95,.14)}
.modal{border-radius:26px;box-shadow:0 30px 80px rgba(18,61,95,.3)}.mh{border-radius:26px 26px 0 0}
.savebar{background:linear-gradient(180deg,rgba(246,250,253,0),#f6fafd 40%)}
</style>
</head>
<body>

<section id="login">
  <form class="lcard" id="lf">
    <h1>essence<b style="font-weight:300">fit</b></h1>
    <p>Painel da lojista. Entre com seu e-mail e senha.</p>
    <label>E-mail<input id="le" type="email" autocomplete="username" required></label>
    <label>Senha<input id="lp" type="password" autocomplete="current-password" required></label>
    <p class="err" id="lerr"></p>
    <button class="btn" style="width:100%;margin-top:8px" id="lb">Entrar</button>
  </form>
</section>

<div id="app" hidden>
  <header><div class="wrap">
    <span class="logo">essence<span>fit</span><em>painel</em></span>
    <div class="hl"><a href="index.html">Ver loja</a><button data-a="sair">Sair</button></div>
  </div></header>
  <div class="wrap">
    <div class="tabs" id="tabs"></div>
    <main id="view"></main>
  </div>
</div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script src="site-padrao.js"></script>
<script>
const SB_URL="https://okcluqowqhgmdrxtxsqg.supabase.co", SB_KEY="sb_publishable_OQSv9L0WYb-hMrwk7AOo-g_NMAoFpeQ";
const $=s=>document.querySelector(s);
const esc=x=>String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const R=n=>"R$ "+Number(n||0).toFixed(2).replace(".",",");
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isNaN(n)?null:n};
const dt=x=>new Date(x).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"});
const ST={recebido:"Novo pedido",pago:"Pago",separando:"Separando",enviado:"Enviado",entregue:"Entregue",cancelado:"Cancelado"};
const CATS=["Conjuntos","Leggings","Calções","Jaquetas","Camisetas"];
let S=null;try{S=JSON.parse(localStorage.getItem("ef_admin")||"null")}catch(e){}
let AL=[],tab="pedidos",P=[],PR=[],CF={},CI=[],TM=[],AV=[],AF="todas",F={st:"aberto",q:""},PQ="",E=null,lastNew=null;
const CAI={pequeno:"Veste pequeno",certo:"Veste certinho",grande:"Veste grande"};
const PGS={approved:"Aprovado",pending:"Aguardando pagamento",in_process:"Em análise",authorized:"Autorizado",rejected:"Recusado",cancelled:"Cancelado",refunded:"Estornado",charged_back:"Contestado"};
const selAL="avaliacoes_loja?select=*&order=criado_em.desc&limit=300";
const selAV="avaliacoes?select=*,produtos(nome)&order=criado_em.desc&limit=300";

function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2800)}
/* ---------- acesso ---------- */
async function auth(path,body,method="POST",tk){
  const h={apikey:SB_KEY,"Content-Type":"application/json"};if(tk)h.Authorization="Bearer "+tk;
  const r=await fetch(SB_URL+"/auth/v1/"+path,{method,headers:h,body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error_description||j.msg||j.message||"Não foi possível entrar.");return j;
}
function setS(j){S={access_token:j.access_token,refresh_token:j.refresh_token,exp:Date.now()/1000+(j.expires_in||3600)-60};localStorage.setItem("ef_admin",JSON.stringify(S))}
function logout(){localStorage.removeItem("ef_admin");S=null;location.reload()}
async function token(){
  if(S.exp<Date.now()/1000){try{setS(await auth("token?grant_type=refresh_token",{refresh_token:S.refresh_token}))}catch(e){logout()}}
  return S.access_token;
}
async function api(path,o={}){
  const h={apikey:SB_KEY,Authorization:"Bearer "+await token(),"Content-Type":"application/json"};if(o.prefer)h.Prefer=o.prefer;
  const r=await fetch(SB_URL+"/rest/v1/"+path,{method:o.method||"GET",headers:h,body:o.body!==undefined?JSON.stringify(o.body):undefined});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok)throw new Error((j&&j.message)||"Erro "+r.status);return j;
}
$("#lf").addEventListener("submit",async e=>{
  e.preventDefault();const b=$("#lb");b.disabled=true;$("#lerr").textContent="";
  try{setS(await auth("token?grant_type=password",{email:$("#le").value.trim(),password:$("#lp").value}));await entrar()}
  catch(x){$("#lerr").textContent=/invalid/i.test(x.message)?"E-mail ou senha incorretos.":x.message;b.disabled=false}
});
async function entrar(){
  const ok=await api("rpc/is_admin",{method:"POST",body:{}});
  if(!ok){localStorage.removeItem("ef_admin");S=null;$("#lerr").textContent="Esta conta não tem acesso de lojista.";$("#lb").disabled=false;return}
  try{await loadAll()}catch(e){localStorage.removeItem("ef_admin");S=null;$("#lerr").textContent="Entrou, mas não foi possível carregar os dados: "+e.message;$("#lb").disabled=false;return}
  $("#login").hidden=true;$("#app").hidden=false;render();setInterval(poll,45000);
}
/* ---------- dados ---------- */
const selP="pedidos?select=*,pedido_itens(*),pedido_eventos(status,criado_em)&order=criado_em.desc&limit=300";
async function loadAll(){
  [P,PR,CF,CI,TM,AV,AL]=await Promise.all([api(selP),api("produtos?select=*,variacoes(*)&order=criado_em.desc"),api("configuracoes?select=*&id=eq.1"),api("cidades_entrega?select=*&order=cidade"),api("tamanhos?select=*&order=ordem"),api(selAV).catch(()=>[]),api(selAL).catch(()=>[])]);
  CF=CF[0]||{};lastNew=P.filter(p=>p.status==="recebido").length;
}
async function poll(){
  try{P=await api(selP);const n=P.filter(p=>p.status==="recebido").length;
    if(lastNew!==null&&n>lastNew)toast("Novo pedido chegou!");lastNew=n;
    if(tab==="pedidos"&&!$("#ov").classList.contains("on")){drawTabs();drawList()}}catch(e){}
}
/* ---------- estrutura ---------- */
const TIC={"pedidos": "<path d=\"M6 2L4 6v14a2 2 0 002 2h12a2 2 0 002-2V6l-2-4z\"/><path d=\"M4 6h16M16 10a4 4 0 01-8 0\"/>", "produtos": "<path d=\"M20.6 13.4l-7.2 7.2a2 2 0 01-2.8 0L3 13V3h10l7.6 7.6a2 2 0 010 2.8z\"/><circle cx=\"7.5\" cy=\"7.5\" r=\"1.2\"/>", "avaliacoes": "<path d=\"M12 2l3 6.9 7.4.7-5.6 4.9 1.7 7.3L12 17.8l-6.5 4 1.7-7.3L1.6 9.6 9 8.9z\"/>", "site": "<rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><circle cx=\"9\" cy=\"9\" r=\"2\"/><path d=\"M21 15l-5-5L5 21\"/>", "ajustes": "<path d=\"M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0\"/><circle cx=\"16\" cy=\"6\" r=\"2\"/><circle cx=\"10\" cy=\"12\" r=\"2\"/><circle cx=\"18\" cy=\"18\" r=\"2\"/>"};
function drawTabs(){
  const n=P.filter(p=>p.status==="recebido").length;
  $("#tabs").innerHTML=[["pedidos","Pedidos"],["produtos","Produtos"],["avaliacoes","Avaliações"],["site","Site"],["ajustes","Ajustes"]].map(([k,l])=>`<button class="tab" data-a="tab" data-id="${k}" aria-pressed="${tab===k}"><svg viewBox="0 0 24 24" aria-hidden="true">${TIC[k]}</svg><span>${l}</span>${k==="pedidos"&&n?`<i>${n}</i>`:""}</button>`).join("");
}
function render(){drawTabs();({pedidos:vPed,produtos:vProd,avaliacoes:vAval,ajustes:vAj,site:vSite})[tab]()}
/* ---------- pedidos ---------- */
function vPed(){
  const c=s=>P.filter(p=>s==="aberto"?!["entregue","cancelado"].includes(p.status):s==="todos"?true:p.status===s).length;
  const ch=[["aberto","Em aberto"],...Object.entries(ST).map(([k,v])=>[k,v]),["todos","Todos"]];
  const hj=new Date(),pm=P.filter(p=>{const d=new Date(p.criado_em);return p.status!=="cancelado"&&d.getMonth()===hj.getMonth()&&d.getFullYear()===hj.getFullYear()});
  const st=(v,l,k)=>`<div class="stat ${k||""}"><b>${v}</b><span>${l}</span></div>`;
  $("#view").innerHTML=`<div class="stats">${st(c("recebido"),"Novos pedidos","hot")}${st(c("aberto"),"Em aberto")}${st(pm.length,"Pedidos no mês")}${st(R(pm.reduce((n,p)=>n+Number(p.total||0),0)),"Vendas no mês")}</div><div class="chips">${ch.map(([k,l])=>`<button class="chip" data-a="fst" data-id="${k}" aria-pressed="${F.st===k}">${l} (${c(k)})</button>`).join("")}</div>
  <input id="pq" placeholder="Buscar por código, nome ou telefone" value="${esc(F.q)}"><div id="plist"></div>`;
  $("#pq").oninput=e=>{F.q=e.target.value;drawList()};drawList();
}
function drawList(){
  const q=F.q.trim().toLowerCase(),d=q.replace(/\D/g,"");
  const l=P.filter(p=>(F.st==="aberto"?!["entregue","cancelado"].includes(p.status):F.st==="todos"||p.status===F.st)&&(!q||p.codigo.toLowerCase().includes(q)||p.nome.toLowerCase().includes(q)||(d&&p.telefone.replace(/\D/g,"").includes(d))));

async function salvar(){
  sync();const e=E,preco=num(e.preco),promo=e.promo.trim()===""?null:num(e.promo);
  if(!e.nome.trim())return toast("Informe o nome do produto.");
  if(preco===null||preco<0)return toast("Informe o preço.");
  if(promo!==null&&promo>=preco)return toast("A promoção precisa ser menor que o preço.");
  const want=[],seen=new Set();
  for(const c of e.cores){const n=c.nome.trim();if(!n)continue;if(seen.has(n.toLowerCase()))return toast("A cor "+n+" está repetida.");seen.add(n.toLowerCase());
    for(const t of TM){const v=(c.est[t.tamanho]??"").toString().trim();if(v==="")continue;const q=parseInt(v,10);if(isNaN(q)||q<0)return toast("Estoque inválido em "+n+" "+t.tamanho+".");want.push({cor:n,cor_hex:c.hex,tamanho:t.tamanho,estoque:q})}}
  const b=$("#sv");b.disabled=true;

  try{

    const key=v=>v.cor+"|"+v.tamanho,old=new Map(e.orig.map(v=>[key(v),v])),ins=[],ups=[];
    want.forEach(v=>{const o=old.get(key(v));if(o){ups.push(api(`variacoes?id=eq.${o.id}`,{method:"PATCH",body:{cor_hex:v.cor_hex,estoque:v.estoque}}));old.delete(key(v))}else ins.push({...v,produto_id:pid})});

  }catch(x){toast(x.message);b.disabled=false}
}

  $("#view").innerHTML=`<h2>Loja</h2><div class="card"><label>WhatsApp (com 55 e DDD)<input id="cw" inputmode="numeric" value="${esc(CF.whatsapp||"")}"></label>
  <label>Frete grátis acima de (R$)<input id="cf" inputmode="decimal" value="${CF.frete_gratis_acima??""}"></label><div class="checks"><label><input type="checkbox" id="cpo" ${CF.pagamento_online?"checked":""}> Receber pagamento online (Pix e cartão)</label></div><p class="sub">Ative só depois de configurar o Mercado Pago (veja o LEIA-ME). Desligado, a cliente paga combinando pelo WhatsApp, como antes.</p><div class="acts"><button class="btn" data-a="scfg">Salvar</button></div></div>
  <h2>Cidades de entrega</h2><div class="card">${CI.map((c,i)=>`<div class="fld"><b>${esc(c.cidade)}</b><input data-ct="${i}" inputmode="decimal" value="${c.taxa}" aria-label="Taxa"><input type="checkbox" data-ca="${i}" ${c.ativo?"checked":""} title="Ativa"><span><button class="btn sm" data-a="scid" data-id="${i}">Salvar</button> <button data-a="dcid" data-id="${i}" style="color:var(--bad);font-size:1.3rem">×</button></span></div>`).join("")}
  <div class="fld" style="margin-top:14px"><input id="nc" placeholder="Nova cidade"><input id="nt" inputmode="decimal" placeholder="Taxa"><span></span><button class="btn sm" data-a="ncid">Adicionar</button></div><p class="sub" style="margin-top:8px">A caixinha marca se a cidade está ativa. A cidade precisa ser escrita igual ao nome oficial para o CEP ser reconhecido.</p></div>
  <h2>Minha senha</h2><div class="card"><label>Nova senha (mínimo 6 caracteres)<input id="ns" type="password" autocomplete="new-password"></label><div class="acts"><button class="btn" data-a="senha">Alterar senha</button></div></div>`;
}
async function scfg(){try{const w=$("#cw").value.replace(/\D/g,""),f=num($("#cf").value);if(!w||f===null)return toast("Confira os valores.");
  const po=$("#cpo").checked;await api("configuracoes?id=eq.1",{method:"PATCH",body:{whatsapp:w,frete_gratis_acima:f,pagamento_online:po}});CF.whatsapp=w;CF.frete_gratis_acima=f;CF.pagamento_online=po;toast("Salvo")}catch(e){toast(e.message)}}
async function scid(i){const c=CI[i],t=num(document.querySelector(`[data-ct="${i}"]`).value);if(t===null)return toast("Taxa inválida.");
  try{await api(`cidades_entrega?cidade=eq.${encodeURIComponent(c.cidade)}`,{method:"PATCH",body:{taxa:t,ativo:document.querySelector(`[data-ca="${i}"]`).checked}});CI=await api("cidades_entrega?select=*&order=cidade");toast("Salvo")}catch(e){toast(e.message)}}
async function dcid(i){const c=CI[i];if(!confirm(`Remover ${c.cidade}?`))return;
  try{await api(`cidades_entrega?cidade=eq.${encodeURIComponent(c.cidade)}`,{method:"DELETE"});CI.splice(i,1);vAj()}catch(e){toast(e.message)}}
async function ncid(){const n=$("#nc").value.trim(),t=num($("#nt").value);if(!n||t===null)return toast("Informe cidade e taxa.");
  try{await api("cidades_entrega",{method:"POST",body:{cidade:n,taxa:t,ativo:true}});CI=await api("cidades_entrega?select=*&order=cidade");vAj();toast("Cidade adicionada")}catch(e){toast(e.message)}}
async function senha(){const s=$("#ns").value;if(s.length<6)return toast("Use pelo menos 6 caracteres.");
  try{await auth("user",{password:s},"PUT",await token());$("#ns").value="";toast("Senha alterada")}catch(e){toast(e.message)}}
/* ---------- site (textos e fotos da loja) ---------- */
const gp=(o,p)=>p.split(".").reduce((x,k)=>x==null?x:x[k],o);
const spset=(o,p,v)=>{const k=p.split("."),l=k.pop();k.reduce((x,y)=>x[y],o)[l]=v};
const fd=(p,l,t,o)=>({p,l,t,o});
const SS=[
 ["Avisos do topo",[0,1,2].map(i=>fd("avisos."+i,"Aviso "+(i+1)))],
 ...[0,1,2].map(i=>["Banner principal "+(i+1),[fd(`slides.${i}.img`,"Foto de fundo (horizontal, 1600×700 px)","img"),fd(`slides.${i}.titulo`,"Título (use *palavra* para negrito)","area"),fd(`slides.${i}.texto`,"Texto","area"),fd(`slides.${i}.botao`,"Texto do botão"),fd(`slides.${i}.link`,"Link do botão (#loja, #novidades ou #promocoes)")]]),
 ["Vantagens (faixa abaixo do banner)",[0,1,2,3].flatMap(i=>[fd(`perks.${i}.t`,"Título "+(i+1)),fd(`perks.${i}.s`,"Descrição "+(i+1))])],
 ["Quem somos",[fd("sobre","Texto (use **palavra** para negrito)","area")]],
 ["Categorias",[fd("tilesTitulo","Título da seção")]],
 ...[0,1].map(i=>["Banner de coleção "+(i+1),[fd(`colecoes.${i}.img`,"Foto (horizontal, 1600×900 px)","img"),fd(`colecoes.${i}.etiqueta`,"Etiqueta pequena"),fd(`colecoes.${i}.titulo`,"Título"),fd(`colecoes.${i}.botao`,"Texto do botão"),fd(`colecoes.${i}.link`,"Ao clicar, mostrar","sel")]]),
 ["Vitrines da página inicial",[fd("railNov","Título das novidades"),fd("railPro","Título das promoções")]],
 ["Depoimentos",[fd("depoTitulo","Título da seção"),...[0,1,2,3].flatMap(i=>[fd(`depo.${i}.img`,"Foto da avaliação "+(i+1),"img"),fd(`depo.${i}.nome`,"Nome "+(i+1)),fd(`depo.${i}.nota`,"Estrelas "+(i+1),"sel",["5","4","3","2","1"]),fd(`depo.${i}.variacao`,"Peça | tamanho | cor "+(i+1)),fd(`depo.${i}.data`,"Data "+(i+1)),fd(`depo.${i}.texto`,"Comentário "+(i+1),"area")])]],
 ["Chamada para novidades",[fd("vip.titulo","Título"),fd("vip.texto","Texto","area"),fd("vip.botao","Botão")]],
 ["Trocas, entrega e pagamento",[0,1,2,3].flatMap(i=>[fd(`pol.${i}.t`,"Título "+(i+1)),fd(`pol.${i}.x`,"Texto "+(i+1),"area")])],
 ["Rodapé",[fd("rodape","Texto","area")]]
];
let imgN=0;
function fieldHTML(S,f){
  const v=gp(S,f.p)??"";
  if(f.t==="img")return `<label>${esc(f.l)}</label><div class="si${/^(slides|colecoes)/.test(f.p)?" w":""}"><img src="${esc(v||(/^(slides|colecoes)/.test(f.p)?sitePHW(imgN++,"teste"):sitePH(imgN++,"teste")))}" alt=""><div class="ac2"><label class="btn alt sm" style="margin:0;cursor:pointer">Trocar foto<input type="file" accept="image/*" data-spup="${f.p}" hidden></label><button class="btn alt sm" data-a="sclr" data-id="${f.p}">Usar foto de teste</button></div><input type="hidden" data-sp="${f.p}" value="${esc(v)}"></div>`;
  if(f.t==="sel")return `<label>${esc(f.l)}<select data-sp="${f.p}">${(f.o||[...CATS,"Novidades","Promoções"]).map(o=>`<option ${o===v?"selected":""}>${o}</option>`).join("")}</select></label>`;
  return `<label>${esc(f.l)}${f.t==="area"?`<textarea data-sp="${f.p}">${esc(v)}</textarea>`:`<input data-sp="${f.p}" value="${esc(v)}">`}</label>`;
}
function vSite(){
  const S=siteMerge(SITE_DEF,CF.site||null);imgN=0;
  $("#view").innerHTML=("site" in CF?"":`<div class="card" style="border-color:var(--bad)"><b>Falta um passo no Supabase</b><p class="sub">Para salvar os textos e as fotos do site, rode uma vez este comando em SQL Editor:</p><code>alter table configuracoes add column if not exists site jsonb;</code></div>`)+
  `<p class="sub" style="margin-top:8px">Aqui você troca os textos e as fotos da página inicial. Enquanto não houver foto, o site mostra uma imagem de teste. Campo de texto vazio volta ao texto padrão.</p>`+
  SS.map(([t,fs])=>`<h2>${esc(t)}</h2><div class="card">${fs.map(f=>fieldHTML(S,f)).join("")}</div>`).join("")+
  `<div class="savebar"><button class="btn" style="width:100%" data-a="ssave">Salvar e publicar no site</button></div>`;
}
async function ssave(){
  const o=JSON.parse(JSON.stringify(siteMerge(SITE_DEF,CF.site||null)));
  document.querySelectorAll("#view [data-sp]").forEach(i=>spset(o,i.dataset.sp,i.value.trim()));
  try{await api("configuracoes?id=eq.1",{method:"PATCH",body:{site:o}});CF.site=o;toast("Site atualizado");vSite()}
  catch(e){toast(/site|column|schema/i.test(e.message)?"Crie a coluna no Supabase (aviso no topo desta aba).":e.message)}
}
document.addEventListener("change",async e=>{
  const i=e.target;if(!i.dataset||!i.dataset.spup||!i.files.length)return;
  toast("Enviando foto…");
  try{const b=await shrink(i.files[0]),n="site-"+Date.now()+"-"+Math.random().toString(36).slice(2,7)+".jpg";
    const r=await fetch(`${SB_URL}/storage/v1/object/produtos/${n}`,{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+await token(),"Content-Type":"image/jpeg"},body:b});
    if(!r.ok)throw new Error("Não foi possível enviar a foto.");
    const u=`${SB_URL}/storage/v1/object/public/produtos/${n}`,w=i.closest(".si");w.querySelector("img").src=u;w.querySelector("[data-sp]").value=u;toast("Foto enviada. Toque em Salvar para publicar.")}
  catch(x){toast(x.message)}
});
/* ---------- janela ---------- */
function modal(h){$("#modal").innerHTML=h;$("#ov").classList.add("on");$("#ov").scrollTop=0}
function closeM(){$("#ov").classList.remove("on");E=null}
/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b){if(e.target.id==="ov")closeM();return}
  const a=b.dataset.a,id=b.dataset.id;
  if(a==="sair")logout();
  else if(a==="tab"){tab=id;render();if(id==="avaliacoes")loadAV()}
  else if(a==="afl"){AF=id;vAval()}
  else if(a==="lres")lres(id);else if(a==="lvis")lvis(id);else if(a==="ldel")ldel(id);
  else if(a==="ares")ares(id);else if(a==="avis")avis(id);else if(a==="adel")adel(id);
  else if(a==="fst"){F.st=id;vPed()}
  else if(a==="ped")openPed(id);
  else if(a==="st")setSt(id,b.dataset.s);
  else if(a==="x")closeM();
  else if(a==="novo")edit(null);
  else if(a==="edit")edit(id);
  else if(a==="dup")dup(id);
  else if(a==="del")del(id);
  else if(a==="addch"){sync();const c=E.cores[+id];if(c.hex.split(",").length<3){c.hex+=",#f1b9cc";drawEd()}}
  else if(a==="rmch"){sync();const c=E.cores[+id],h=c.hex.split(",");if(h.length>1){h.pop();c.hex=h.join(",");drawEd()}}
  else if(a==="rmf"){sync();E.fotos.splice(+id,1);drawEd()}
  else if(a==="capa"){sync();const[f]=E.fotos.splice(+id,1);E.fotos.unshift(f);drawEd()}
  else if(a==="rmc"){sync();E.cores.splice(+id,1);drawEd()}
  else if(a==="addc"){sync();E.cores.push({nome:"",hex:"#a9cdeb",est:{}});drawEd()}
  else if(a==="salvar")salvar();
  else if(a==="ssave")ssave();
  else if(a==="sclr"){const w=b.closest(".si");w.querySelector("[data-sp]").value="";w.querySelector("img").src=w.classList.contains("w")?sitePHW(0,"teste"):sitePH(0,"teste");toast("Foto de teste. Toque em Salvar.")}
  else if(a==="scfg")scfg();else if(a==="scid")scid(+id);else if(a==="dcid")dcid(+id);else if(a==="ncid")ncid();else if(a==="senha")senha();
});
document.addEventListener("change",e=>{if(e.target.dataset&&e.target.dataset.fc!==undefined){sync();const i=+e.target.dataset.fc,b=E.fotos[i].replace(/#cor=.*$/,""),v=e.target.value;E.fotos[i]=v?b+"#cor="+encodeURIComponent(v):b;drawEd();return}if(e.target.id==="up"&&e.target.files.length)addFotos([...e.target.files])});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});
if(S)entrar().catch(()=>{localStorage.removeItem("ef_admin");S=null});
</script>
</body>
</html>
